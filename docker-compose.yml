services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dreamehub
      POSTGRES_USER: dreamehub
      POSTGRES_PASSWORD: dreamehub_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamehub -d dreamehub"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://dreamehub:dreamehub_password@postgres:5432/dreamehub
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - generated_assets:/app/public/generated

volumes:
  postgres_data:
  generated_assets:
